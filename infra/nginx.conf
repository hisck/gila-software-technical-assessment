server {
    listen 8080 default_server;
    server_name _;
    return 400;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=5s ipv6=off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' $next_script_hashes; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    proxy_connect_timeout 2s;
    proxy_read_timeout 25s;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_intercept_errors on;
    error_page 413 = @too_large;
    error_page 502 504 = @unavailable;

    location /api/catalog/ {
        set $destination catalog:8080;
        proxy_pass http://$destination;
    }

    location /api/search/ {
        set $destination search:8080;
        proxy_pass http://$destination;
    }

    location ~ ^/api/orders(?:/|$) {
        set $destination orders:8080;
        proxy_pass http://$destination;
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"Unknown API endpoint"}';
    }

    location @too_large {
        default_type application/json;
        return 413 '{"error":"Upload exceeds 1 MiB"}';
    }

    location @unavailable {
        default_type application/json;
        return 503 '{"error":"Service is temporarily unavailable. Try again shortly."}';
    }

    location = /sample-products.csv {
        types { text/csv csv; }
        default_type text/csv;
    }

    location /_next/static/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
